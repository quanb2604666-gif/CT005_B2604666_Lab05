<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Thêm thẻ Meta này vào Head -->
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Infographic & Video YouTube</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6 flex flex-col items-center gap-8">

    <!-- KHỐI 1: INFOGRAPHIC -->
    <div class="w-full max-w-4xl bg-white p-4 rounded-xl shadow-md">
        <h2 class="text-xl font-bold mb-4 text-center text-gray-800">Infographic</h2>
        <img 
            src="Lab05_Ex2.1.png" 
            alt="Infographic" 
            class="w-full h-auto rounded-lg"
        >
    </div>

    <!-- KHỐI 2: VIDEO YOUTUBE -->
    <div class="w-full max-w-4xl bg-white p-4 rounded-xl shadow-md">s
        <h2 class="text-xl font-bold mb-4 text-center text-gray-800">Video YouTube</h2>
        <div class="relative w-full overflow-hidden rounded-lg" style="padding-top: 56.25%;">
            <iframe 
                class="absolute top-0 left-0 w-full h-full"
                src="https://www.youtube.com/embed/InZfRuZUODA?autoplay=1&mute=1" 
                title="YouTube video player" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                referrerpolicy="strict-origin-when-cross-origin"
                allowfullscreen>
            </iframe>
        </div>
    </div>

</body>
</html>
